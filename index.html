<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>Watchlist</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="shell">

  <header class="top">
    <div>
      <h1>Watchlist</h1>
      <div class="updated" id="updatedLabel">not checked yet</div>
    </div>
    <button class="icon-btn" id="settingsToggle" aria-label="Settings" title="Settings">⚙</button>
  </header>

  <section class="panel hidden" id="settingsPanel">
    <h2>Backend</h2>
    <label for="backendUrl">Server URL</label>
    <input id="backendUrl" type="text" placeholder="https://your-app.onrender.com" autocomplete="off" />
    <label for="accessToken">Access token</label>
    <input id="accessToken" type="text" placeholder="the ACCESS_TOKEN you set on the server" autocomplete="off" />
    <label for="pollSeconds">Foreground check interval (seconds)</label>
    <input id="pollSeconds" type="number" min="30" step="10" value="60" />
    <p class="help">
      See the README for setup (Render + Upstash + Finnhub + Claude/ChatGPT/Gemini, all free or low-cost tiers).
    </p>
    <button class="btn primary" id="saveSettings">Save &amp; enable notifications</button>
    <div class="help" id="pushStatus"></div>
  </section>

  <section class="panel hidden" id="addPanel">
    <h2>Add a stock</h2>
    <label for="symInput">Ticker symbol</label>
    <input id="symInput" type="text" placeholder="e.g. MSFT" autocomplete="off" style="text-transform:uppercase" />
    <div class="row3">
      <div>
        <label for="entryLowInput">Entry low</label>
        <input id="entryLowInput" type="number" step="0.01" placeholder="0.00" />
      </div>
      <div>
        <label for="entryHighInput">Entry high</label>
        <input id="entryHighInput" type="number" step="0.01" placeholder="0.00" />
      </div>
      <div>
        <label for="stopLossInput">Stop-loss</label>
        <input id="stopLossInput" type="number" step="0.01" placeholder="0.00" />
      </div>
    </div>
    <label for="takeProfitInput">Take-profit (optional)</label>
    <input id="takeProfitInput" type="number" step="0.01" placeholder="0.00" />
    <button class="btn primary" id="addStock">Add to watchlist</button>
  </section>

  <section class="panel" id="analyzePanel">
    <h2>Quick analysis <span class="badge-sub">3-model consensus</span></h2>
    <label for="analyzeSym">Ticker symbol</label>
    <div class="row3" style="grid-template-columns: 1fr auto;">
      <input id="analyzeSym" type="text" placeholder="e.g. NVDA" autocomplete="off" style="text-transform:uppercase" />
      <button class="btn primary" id="analyzeBtn" style="width:auto; margin-top:0;">Analyze</button>
    </div>
    <div id="analyzeResult"></div>
  </section>

  <div class="count" id="countLabel"></div>

  <div id="list"></div>

  <div class="empty hidden" id="emptyState">
    <p id="emptyMessage">Add your backend details in settings to start tracking prices.</p>
  </div>

  <button class="btn" id="addToggle">+ Add a stock</button>
  <button class="btn" id="checkNow">Check prices now</button>

</div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
